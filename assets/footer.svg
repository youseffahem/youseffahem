<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="Building systems from the database layer to the microcontroller" preserveAspectRatio="xMidYMid meet">
<title>Closing banner</title>
<defs>
  <linearGradient id="fvoid" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#05010B"/>
    <stop offset="0.55" stop-color="#0E0220"/>
    <stop offset="1" stop-color="#2A0426"/>
  </linearGradient>
  <radialGradient id="horizon" cx="0.5" cy="1" r="0.72">
    <stop offset="0" stop-color="#FF2D75" stop-opacity="0.55"/>
    <stop offset="0.35" stop-color="#DC143C" stop-opacity="0.24"/>
    <stop offset="1" stop-color="#8B0020" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="fline" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#DC143C" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#FF2D75" stop-opacity="0.75"/>
    <stop offset="1" stop-color="#DC143C" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="fpulse" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FF2D75" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="1"/>
    <stop offset="1" stop-color="#FF2D75" stop-opacity="0"/>
  </linearGradient>
  <filter id="fg" x="-100%" y="-300%" width="300%" height="700%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="fsoft"><feGaussianBlur stdDeviation="22"/></filter>
  <style>
    .rise{fill:#FF8FC4;animation:rs 13s linear infinite}
    @keyframes rs{0%{transform:translateY(30px);opacity:0}18%{opacity:.85}100%{transform:translateY(-135px);opacity:0}}
    .st{fill:#FFD9EA;animation:ftw 4.6s ease-in-out infinite}
    @keyframes ftw{0%,100%{opacity:.12}50%{opacity:.8}}
    .t{font-family:'JetBrains Mono','Fira Code',ui-monospace,Consolas,monospace}
  </style>
</defs>

<rect width="1200" height="190" fill="url(#fvoid)"/>
<ellipse cx="600" cy="200" rx="620" ry="150" fill="url(#horizon)" filter="url(#fsoft)">
  <animate attributeName="rx" values="620;700;620" dur="17s" repeatCount="indefinite"/>
</ellipse>

<g>
  <circle class="st" cx="94" cy="38" r="1.4" style="animation-delay:0s"/>
  <circle class="st" cx="238" cy="66" r="1.1" style="animation-delay:.9s"/>
  <circle class="st" cx="392" cy="30" r="1.6" style="animation-delay:1.8s"/>
  <circle class="st" cx="546" cy="58" r="1.2" style="animation-delay:2.7s"/>
  <circle class="st" cx="702" cy="34" r="1.5" style="animation-delay:.45s"/>
  <circle class="st" cx="858" cy="62" r="1.1" style="animation-delay:3.2s"/>
  <circle class="st" cx="1004" cy="28" r="1.7" style="animation-delay:1.35s"/>
  <circle class="st" cx="1136" cy="56" r="1.3" style="animation-delay:2.25s"/>
</g>

<g>
  <circle class="rise" cx="150" cy="170" r="2" style="animation-delay:0s"/>
  <circle class="rise" cx="330" cy="170" r="1.6" style="animation-delay:2.2s"/>
  <circle class="rise" cx="500" cy="170" r="2.3" style="animation-delay:4.4s"/>
  <circle class="rise" cx="690" cy="170" r="1.8" style="animation-delay:6.5s"/>
  <circle class="rise" cx="870" cy="170" r="2.1" style="animation-delay:8.7s"/>
  <circle class="rise" cx="1050" cy="170" r="1.7" style="animation-delay:10.9s"/>
</g>

<rect x="180" y="94" width="840" height="1.2" fill="url(#fline)"/>
<rect x="-240" y="93.4" width="240" height="2.4" fill="url(#fpulse)" filter="url(#fg)" opacity="0.85">
  <animate attributeName="x" values="-240;1200" dur="7.5s" repeatCount="indefinite"/>
</rect>

<text class="t" x="600" y="74" text-anchor="middle" font-size="15" font-weight="600" letter-spacing="5.2" fill="#FFB3D2" filter="url(#fg)">FROM THE DATABASE LAYER TO THE MICROCONTROLLER</text>
<text class="t" x="600" y="126" text-anchor="middle" font-size="12" letter-spacing="3.6" fill="#9B7A96">GITHUB.COM/YOUSEFFAHEM</text>
</svg>
