<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="HeartGuard AI - machine learning cardiovascular risk assessment" preserveAspectRatio="xMidYMid meet">
<title>HeartGuard AI</title>
<defs>
  <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1A0316"/>
    <stop offset="0.42" stop-color="#2A0620"/>
    <stop offset="1" stop-color="#08010F"/>
  </linearGradient>
  <linearGradient id="wash" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FF2D75" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#FF2D75" stop-opacity="0.16"/>
    <stop offset="1" stop-color="#FF2D75" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#FF9CC8"/>
  </linearGradient>
  <linearGradient id="lacc" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FF4D9E"/>
    <stop offset="1" stop-color="#8B0020"/>
  </linearGradient>
  <filter id="cg" x="-60%" y="-200%" width="220%" height="500%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="cgs" x="-300%" y="-300%" width="700%" height="700%">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .t{font-family:'JetBrains Mono','Fira Code',ui-monospace,Consolas,monospace}
    .bar{fill:#DC143C;opacity:.55;animation:bh 3.4s ease-in-out infinite;transform-origin:bottom}
    @keyframes bh{0%,100%{opacity:.35}50%{opacity:.9}}
  </style>
</defs>

<rect x="1" y="1" width="1198" height="118" rx="14" fill="url(#cbg)"/>
<rect x="-420" y="1" width="420" height="118" fill="url(#wash)">
  <animate attributeName="x" values="-420;1200" dur="10s" repeatCount="indefinite"/>
</rect>
<rect x="1" y="1" width="1198" height="118" rx="14" fill="none" stroke="#DC143C" stroke-opacity="0.32" stroke-width="1.4"/>
<rect x="1" y="1" width="1198" height="118" rx="14" fill="none" stroke="#FF6BB0" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="170 2438" filter="url(#cgs)">
  <animate attributeName="stroke-dashoffset" values="2608;0" dur="7s" repeatCount="indefinite"/>
</rect>

<rect x="28" y="30" width="4.5" height="60" rx="2.25" fill="url(#lacc)" filter="url(#cgs)"/>

<text class="t" x="50" y="44" font-size="12" letter-spacing="3.4" fill="#FF6BB0" opacity="0.95">SCIKIT-LEARN &#183; XGBOOST &#183; STREAMLIT</text>
<text class="t" x="50" y="78" font-size="34" font-weight="700" letter-spacing="3.4" fill="url(#ttl)" filter="url(#cg)">HEARTGUARD AI</text>
<text class="t" x="50" y="100" font-size="12.5" letter-spacing="1.6" fill="#9B7A96">Cardiovascular risk classification &#183; UCI dataset</text>

<g transform="translate(770 0)">
  <path d="M0,60 L46,60 L58,34 L72,86 L86,48 L98,60 L140,60 L152,40 L166,80 L178,60 L230,60 L242,30 L256,90 L268,60 L330,60"
        fill="none" stroke="#8B0020" stroke-width="1.6" opacity="0.4"/>
  <path d="M0,60 L46,60 L58,34 L72,86 L86,48 L98,60 L140,60 L152,40 L166,80 L178,60 L230,60 L242,30 L256,90 L268,60 L330,60"
        fill="none" stroke="#FF4D9E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="120 640" filter="url(#cgs)">
    <animate attributeName="stroke-dashoffset" values="760;0" dur="3.4s" repeatCount="indefinite"/>
  </path>

  <g>
    <rect class="bar" x="352" y="40" width="9" height="40" rx="2"/>
    <rect class="bar" x="366" y="48" width="9" height="32" rx="2" style="animation-delay:.4s"/>
    <rect class="bar" x="380" y="54" width="9" height="26" rx="2" style="animation-delay:.8s"/>
    <rect class="bar" x="394" y="60" width="9" height="20" rx="2" style="animation-delay:1.2s"/>
  </g>
  <text class="t" x="379" y="94" font-size="8.5" letter-spacing="1" fill="#9B7A96" text-anchor="middle">model scores</text>
</g>
</svg>
