.drop{animation:drop 6s ease-in-out infinite}@keyframes drop{0%,6%{opacity:0;transform:translateY(-8px)}11%{opacity:1}20%{opacity:0;transform:translateY(8px)}100%{opacity:0;transform:translateY(8px)}}
.chev{animation:chev 6s ease-in-out infinite}@keyframes chev{0%,100%{opacity:.25}10%{opacity:1}24%{opacity:.25}}
.gl{animation:gl 2.6s ease-in-out infinite}@keyframes gl{0%,100%{opacity:.4}50%{opacity:1}}
.dch{animation:dch 4.8s ease-in-out infinite}@keyframes dch{0%,100%{opacity:.5}50%{opacity:1}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs>
