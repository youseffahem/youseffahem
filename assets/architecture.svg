<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 460 566" width="460" height="566" role="img" aria-label="Intelligent systems architecture. Six layers flow downward: data sources, processing, machine learning, backend, application, and real-world impact. Below them, six engineering domains: backend, machine learning, computer vision, mobile, embedded and testing." preserveAspectRatio="xMidYMid meet">
<title>Intelligent systems architecture</title>

