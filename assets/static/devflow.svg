<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 196" width="1200" height="196" role="img" aria-label="Development flow. Commits accumulate on the main branch with a feature branch that diverges and merges back, feeding a continuous integration pipeline: commit, build, test, deploy." preserveAspectRatio="xMidYMid meet">
<title>Static (reduced motion): Development flow</title>

<defs>
<linearGradient id="pg" x1="0" y1="0" x2="0.55" y2="1"><stop offset="0" stop-color="#07111F"/><stop offset="0.5" stop-color="#0B1120"/><stop offset="1" stop-color="#050A12"/></linearGradient>
<linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F8FAFC"/><stop offset="0.55" stop-color="#22C55E"/><stop offset="1" stop-color="#06B6D4"/></linearGradient>
<linearGradient id="tl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22C55E" stop-opacity="0"/><stop offset="0.5" stop-color="#22C55E" stop-opacity="0.9"/><stop offset="1" stop-color="#22C55E" stop-opacity="0"/></linearGradient>
<linearGradient id="pk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22C55E" stop-opacity="0"/><stop offset="0.6" stop-color="#22C55E"/><stop offset="1" stop-color="#F8FAFC"/></linearGradient>
<linearGradient id="pkb" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#22C55E" stop-opacity="0"/><stop offset="0.6" stop-color="#22C55E"/><stop offset="1" stop-color="#F8FAFC"/></linearGradient>
<radialGradient id="bl1" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#22C55E" stop-opacity="0.15"/><stop offset="1" stop-color="#22C55E" stop-opacity="0"/></radialGradient>
<radialGradient id="bl2" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#06B6D4" stop-opacity="0.13"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#101D30" stroke-width="1"/></pattern>
<filter id="g2" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="g3" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feGaussianBlur stdDeviation="30"/></filter>
<style>
