<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 306" width="1200" height="306" role="img" aria-label="RealEstate, a Flask and MySQL property management platform. A request travels from the client through a Flask route, validation module, parameterised SQL and MySQL InnoDB, and back as a Jinja2 rendered response. Six normalised tables are linked by foreign keys with restrict, set null and cascade delete rules, and the schema is asserted by a 274 test suite covering the API, validation, analytics and schema layers." preserveAspectRatio="xMidYMid meet">
