<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 308" width="1200" height="308" role="img" aria-label="Gym App, a cross-platform Flutter fitness tracking application. The mobile client drives Provider state management, which persists to Hive locally and synchronises with Cloud Firestore, with Firebase Auth for sign-in. Progress analytics are computed on top. Seven main screens: login, home, exercises, workouts, profile and detail views." preserveAspectRatio="xMidYMid meet">
