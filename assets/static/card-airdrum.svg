<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Space Drums architecture. A strike travels from webcam capture through perception of hand landmarks or red stick tips, a causal per-hand tracker, stroke and zone geometry and a commit state machine into the audio sample bank, while prediction feeds commit without ever importing geometry. Twelve import layers are enforced by import-linter: all seven contracts kept, zero broken, across 198 files and 564 dependencies. Two input modes: bare-hand fingertips and red-tip sticks." preserveAspectRatio="xMidYMid meet">
