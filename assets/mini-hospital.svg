<linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F8FAFC"/><stop offset="0.55" stop-color="#3B82F6"/><stop offset="1" stop-color="#06B6D4"/></linearGradient>
<linearGradient id="tl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3B82F6" stop-opacity="0"/><stop offset="0.5" stop-color="#3B82F6" stop-opacity="0.9"/><stop offset="1" stop-color="#3B82F6" stop-opacity="0"/></linearGradient>
