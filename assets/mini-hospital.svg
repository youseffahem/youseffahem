<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 380 214" width="380" height="214" role="img" aria-label="Hospital Management System. A C++ console application modelling hospital branches, doctors and patients as singly linked lists, with insertion, traversal, search and delete by id across each entity, and class-based separation per entity type." preserveAspectRatio="xMidYMid meet">
<title>HOSPITAL MANAGEMENT</title>

<defs>
