<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 88" width="1200" height="88" role="img" aria-label="Section heading: Engineering activity, contributions, commits and development flow." preserveAspectRatio="xMidYMid meet">
<title>Section: Engineering Activity</title>

<defs>
<linearGradient id="pg" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#0F172A"/><stop offset="1" stop-color="#0B1120"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22C55E" stop-opacity="0.75"/><stop offset="0.45" stop-color="#243044" stop-opacity="0.9"/><stop offset="1" stop-color="#1E293B" stop-opacity="0.6"/></linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22C55E"/><stop offset="1" stop-color="#22C55E" stop-opacity="0.25"/></linearGradient>
