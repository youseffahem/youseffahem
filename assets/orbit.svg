<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 460" width="460" height="460" role="img" aria-label="Orbital diagram: backend, data, mobile and embedded domains" preserveAspectRatio="xMidYMid meet">
<title>Engineering domains in orbit</title>
<defs>
  <linearGradient id="obg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#070212"/>
    <stop offset="0.5" stop-color="#140427"/>
    <stop offset="1" stop-color="#070212"/>
  </linearGradient>
  <radialGradient id="ocore" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
    <stop offset="0.28" stop-color="#FF6BB0" stop-opacity="0.9"/>
    <stop offset="0.7" stop-color="#DC143C" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#8B0020" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="ohalo" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#FF2D75" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#FF2D75" stop-opacity="0"/>
  </radialGradient>
  <filter id="og" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="ogt" x="-80%" y="-200%" width="260%" height="500%">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .ringp{animation:rr 5s ease-in-out infinite}
    @keyframes rr{0%,100%{opacity:.25}50%{opacity:.7}}
    .corepulse{animation:cp 4.2s ease-in-out infinite;transform-origin:230px 230px}
    @keyframes cp{0%,100%{transform:scale(.9);opacity:.85}50%{transform:scale(1.12);opacity:1}}
    .shock{animation:sk 4.2s ease-out infinite;transform-origin:230px 230px}
    @keyframes sk{0%{transform:scale(.5);opacity:.65}100%{transform:scale(2.5);opacity:0}}
    .lbl{font-family:'JetBrains Mono','Fira Code',ui-monospace,Consolas,monospace;font-size:15px;font-weight:600;letter-spacing:3px;fill:#FFB3D2}
  </style>
</defs>

<rect width="460" height="460" rx="18" fill="url(#obg)"/>
<circle cx="230" cy="230" r="200" fill="url(#ohalo)"/>
<rect x="0.75" y="0.75" width="458.5" height="458.5" rx="18" fill="none" stroke="#DC143C" stroke-opacity="0.28" stroke-width="1.5"/>

<circle class="ringp" cx="230" cy="230" r="170" fill="none" stroke="#8B0020" stroke-width="1" stroke-dasharray="2 8"/>

<g fill="none" stroke="#DC143C" stroke-width="1">
  <circle class="ringp" cx="230" cy="230" r="62" stroke-opacity="0.75" style="animation-delay:0s"/>
  <circle class="ringp" cx="230" cy="230" r="100" stroke-opacity="0.6" style="animation-delay:1.2s"/>
  <circle class="ringp" cx="230" cy="230" r="138" stroke-opacity="0.45" style="animation-delay:2.4s"/>
</g>

<circle class="shock" cx="230" cy="230" r="26" fill="none" stroke="#FF2D75" stroke-width="1.5"/>
<g class="corepulse">
  <circle cx="230" cy="230" r="26" fill="url(#ocore)"/>
</g>

<g>
  <animateTransform attributeName="transform" type="rotate" from="0 230 230" to="360 230 230" dur="14s" repeatCount="indefinite"/>
  <circle cx="292" cy="230" r="5" fill="#FF6BB0" filter="url(#og)"/>
</g>
<g>
  <animateTransform attributeName="transform" type="rotate" from="360 230 230" to="0 230 230" dur="22s" repeatCount="indefinite"/>
  <circle cx="330" cy="230" r="4.2" fill="#FF2D75" filter="url(#og)"/>
  <circle cx="130" cy="230" r="3" fill="#DC143C" filter="url(#og)" opacity="0.8"/>
</g>
<g>
  <animateTransform attributeName="transform" type="rotate" from="0 230 230" to="360 230 230" dur="32s" repeatCount="indefinite"/>
  <circle cx="368" cy="230" r="4.6" fill="#FFC2DE" filter="url(#og)"/>
  <circle cx="230" cy="92" r="2.6" fill="#FF8FC4" filter="url(#og)" opacity="0.75"/>
</g>

<text class="lbl" x="230" y="40" text-anchor="middle" filter="url(#ogt)">BACKEND</text>
<text class="lbl" x="424" y="236" text-anchor="end" filter="url(#ogt)">DATA</text>
<text class="lbl" x="230" y="432" text-anchor="middle" filter="url(#ogt)">MOBILE</text>
<text class="lbl" x="36" y="236" text-anchor="start" filter="url(#ogt)">EMBEDDED</text>

<g stroke="#FF2D75" stroke-width="1.5" fill="none" opacity="0.55">
  <path d="M18,54 L18,18 L54,18"/>
  <path d="M442,54 L442,18 L406,18"/>
  <path d="M18,406 L18,442 L54,442"/>
  <path d="M442,406 L442,442 L406,442"/>
</g>
</svg>
