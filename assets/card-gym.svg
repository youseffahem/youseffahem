<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="FitTracker Pro - Flutter fitness tracking application" preserveAspectRatio="xMidYMid meet">
<title>FitTracker Pro</title>
<defs>
  <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#150322"/>
    <stop offset="0.42" stop-color="#26072C"/>
    <stop offset="1" stop-color="#08010F"/>
  </linearGradient>
  <linearGradient id="wash" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FF2D75" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#FF2D75" stop-opacity="0.16"/>
    <stop offset="1" stop-color="#FF2D75" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#FF9CC8"/>
  </linearGradient>
  <linearGradient id="lacc" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FF4D9E"/>
    <stop offset="1" stop-color="#8B0020"/>
  </linearGradient>
  <linearGradient id="barg" x1="0" y1="1" x2="0" y2="0">
    <stop offset="0" stop-color="#8B0020"/>
    <stop offset="1" stop-color="#FF4D9E"/>
  </linearGradient>
  <filter id="cg" x="-60%" y="-200%" width="220%" height="500%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="cgs" x="-300%" y="-300%" width="700%" height="700%">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .t{font-family:'JetBrains Mono','Fira Code',ui-monospace,Consolas,monospace}
  </style>
</defs>

<rect x="1" y="1" width="1198" height="118" rx="14" fill="url(#cbg)"/>
<rect x="-420" y="1" width="420" height="118" fill="url(#wash)">
  <animate attributeName="x" values="-420;1200" dur="10s" repeatCount="indefinite"/>
</rect>
<rect x="1" y="1" width="1198" height="118" rx="14" fill="none" stroke="#DC143C" stroke-opacity="0.32" stroke-width="1.4"/>
<rect x="1" y="1" width="1198" height="118" rx="14" fill="none" stroke="#FF6BB0" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="170 2438" filter="url(#cgs)">
  <animate attributeName="stroke-dashoffset" values="2608;0" dur="7s" repeatCount="indefinite"/>
</rect>

<rect x="28" y="30" width="4.5" height="60" rx="2.25" fill="url(#lacc)" filter="url(#cgs)"/>

<text class="t" x="50" y="44" font-size="12" letter-spacing="3.4" fill="#FF6BB0" opacity="0.95">FLUTTER &#183; DART &#183; FIREBASE &#183; HIVE</text>
<text class="t" x="50" y="78" font-size="34" font-weight="700" letter-spacing="3.4" fill="url(#ttl)" filter="url(#cg)">FITTRACKER PRO</text>
<text class="t" x="50" y="100" font-size="12.5" letter-spacing="1.6" fill="#9B7A96">Cross-platform fitness tracking &#183; Provider state</text>

<g transform="translate(820 0)">
  <line x1="0" y1="92" x2="270" y2="92" stroke="#8B0020" stroke-width="1" opacity="0.6"/>
  <g>
    <rect x="6" y="60" width="13" height="32" rx="3" fill="url(#barg)">
      <animate attributeName="height" values="18;32;18" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="74;60;74" dur="5s" repeatCount="indefinite"/>
    </rect>
    <rect x="27" y="48" width="13" height="44" rx="3" fill="url(#barg)">
      <animate attributeName="height" values="30;44;30" dur="5s" begin="-0.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="62;48;62" dur="5s" begin="-0.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="48" y="36" width="13" height="56" rx="3" fill="url(#barg)">
      <animate attributeName="height" values="40;56;40" dur="5s" begin="-1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="52;36;52" dur="5s" begin="-1s" repeatCount="indefinite"/>
    </rect>
    <rect x="69" y="52" width="13" height="40" rx="3" fill="url(#barg)">
      <animate attributeName="height" values="26;40;26" dur="5s" begin="-1.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="66;52;66" dur="5s" begin="-1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="90" y="28" width="13" height="64" rx="3" fill="url(#barg)">
      <animate attributeName="height" values="46;64;46" dur="5s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="46;28;46" dur="5s" begin="-2s" repeatCount="indefinite"/>
    </rect>
    <rect x="111" y="44" width="13" height="48" rx="3" fill="url(#barg)">
      <animate attributeName="height" values="32;48;32" dur="5s" begin="-2.5s" repeatCount="indefinite"/>
      <animate attributeName="y" values="60;44;60" dur="5s" begin="-2.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <path id="trend" d="M12,58 L33,46 L54,34 L75,50 L96,26 L117,42" fill="none" stroke="#FFC2DE" stroke-width="1.6" opacity="0.75" stroke-dasharray="3 5"/>
  <circle r="3.2" fill="#FFFFFF" filter="url(#cgs)">
    <animateMotion dur="4.5s" repeatCount="indefinite"><mpath href="#trend" xlink:href="#trend"/></animateMotion>
  </circle>

  <g transform="translate(176 26)">
    <rect x="0" y="0" width="46" height="66" rx="7" fill="none" stroke="#DC143C" stroke-width="1.4" opacity="0.8"/>
    <rect x="6" y="9" width="34" height="4" rx="2" fill="#FF2D75" opacity="0.7"/>
    <rect x="6" y="19" width="24" height="4" rx="2" fill="#FF2D75" opacity="0.45"/>
    <rect x="6" y="29" width="30" height="4" rx="2" fill="#FF2D75" opacity="0.45"/>
    <rect x="6" y="39" width="20" height="4" rx="2" fill="#FF2D75" opacity="0.45"/>
    <circle cx="23" cy="57" r="3" fill="#FF6BB0">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</g>
</svg>
