<path d="M22,56 H558" stroke="#1E293B" stroke-width="1"/>
<g class="scan"><rect x="22" y="63" width="536" height="15" fill="url(#sl)"/><rect x="22" y="83" width="536" height="1" fill="#3B82F6" opacity="0.34"/></g>
<rect class="bt" x="26" y="72" width="5" height="5" rx="1.2" fill="#3B82F6" style="animation-delay:0.00s"/>
<text x="39" y="77" font-size="11" letter-spacing="0.3" fill="#94A3B8">Python 3.11</text>
<path d="M39,82 H178" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="1 4" opacity="0.6"/>
<rect class="bt" x="294" y="72" width="5" height="5" rx="1.2" fill="#3B82F6" style="animation-delay:0.16s"/>
<text x="307" y="77" font-size="11" letter-spacing="0.3" fill="#94A3B8">Flask 3.1.1</text>
