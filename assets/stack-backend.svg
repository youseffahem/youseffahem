<rect class="bt" x="294" y="93" width="5" height="5" rx="1.2" fill="#3B82F6" style="animation-delay:0.48s"/>
<text x="307" y="98" font-size="11" letter-spacing="0.3" fill="#94A3B8">MySQL InnoDB</text>
<path d="M307,103 H446" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="1 4" opacity="0.6"/>
<rect class="bt" x="26" y="114" width="5" height="5" rx="1.2" fill="#3B82F6" style="animation-delay:0.64s"/>
<text x="39" y="119" font-size="11" letter-spacing="0.3" fill="#94A3B8">Werkzeug</text>
<path d="M39,124 H178" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="1 4" opacity="0.6"/>
<rect class="bt" x="294" y="114" width="5" height="5" rx="1.2" fill="#3B82F6" style="animation-delay:0.80s"/>
<text x="307" y="119" font-size="11" letter-spacing="0.3" fill="#94A3B8">python-dotenv</text>
<path d="M307,124 H446" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="1 4" opacity="0.6"/>
<path d="M22,157 H558" stroke="#1E293B" stroke-width="1"/>
<text x="26" y="184" font-size="7.5" letter-spacing="1.4" fill="#475569">FLOW</text>
<path d="M72,181 H546" stroke="#243044" stroke-width="1" stroke-dasharray="3 4"/>
<circle class="fn" cx="72.0" cy="181" r="3.2" fill="#3B82F6" style="animation-delay:0.00s"/>
<text x="69.0" y="195" text-anchor="start" font-size="7.5" letter-spacing="0.9" fill="#64748B">REQUEST</text>
<circle class="fn" cx="230.0" cy="181" r="3.2" fill="#3B82F6" style="animation-delay:0.42s"/>
<text x="230.0" y="195" text-anchor="middle" font-size="7.5" letter-spacing="0.9" fill="#64748B">VALIDATE</text>
<circle class="fn" cx="388.0" cy="181" r="3.2" fill="#3B82F6" style="animation-delay:0.84s"/>
<text x="388.0" y="195" text-anchor="middle" font-size="7.5" letter-spacing="0.9" fill="#64748B">SQL</text>
<circle class="fn" cx="546.0" cy="181" r="3.2" fill="#3B82F6" style="animation-delay:1.26s"/>
<text x="549.0" y="195" text-anchor="end" font-size="7.5" letter-spacing="0.9" fill="#64748B">RESPONSE</text>
<circle class="fl" cx="72" cy="181" r="2.4" fill="#F8FAFC" filter="url(#cg)"/>
<g><rect x="26" y="209" width="127" height="20" rx="5" fill="#0B1120" stroke="#243044" stroke-width="1"/><circle class="led" cx="37" cy="219" r="2.8" fill="#3B82F6" style="animation-delay:0.0s"/><text x="47" y="222.5" font-size="8.5" letter-spacing="0.7" fill="#94A3B8">SCHEMA: ENFORCED</text></g>
<g><rect x="162" y="209" width="164" height="20" rx="5" fill="#0B1120" stroke="#243044" stroke-width="1"/><circle class="led" cx="173" cy="219" r="2.8" fill="#3B82F6" style="animation-delay:0.4s"/><text x="183" y="222.5" font-size="8.5" letter-spacing="0.7" fill="#94A3B8">QUERIES: PARAMETERIZED</text></g>
<text x="554" y="222.5" text-anchor="end" font-size="8.5" letter-spacing="1.1" fill="#475569">6 MODULES</text>
