<rect class="bt" x="26" y="93" width="5" height="5" rx="1.2" fill="#3B82F6" style="animation-delay:0.32s"/>
<text x="39" y="98" font-size="11" letter-spacing="0.3" fill="#94A3B8">Jinja2</text>
