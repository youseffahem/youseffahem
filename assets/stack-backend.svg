<rect class="bus" x="-18" y="233.6" width="18" height="2.8" rx="1.4" fill="url(#pkg)" filter="url(#cg)" style="animation-delay:0s"/>
<rect class="bus" x="-18" y="233.6" width="18" height="2.8" rx="1.4" fill="url(#pkg)" filter="url(#cg)" style="animation-delay:-2.3s"/>
