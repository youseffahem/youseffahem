<style>
text{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace}.sans{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.sw{animation:sw 6.5s linear infinite}@keyframes sw{from{transform:translateX(-460px)}to{transform:translateX(1200px)}}
.ab{animation:ab 3s ease-in-out infinite}@keyframes ab{0%,100%{opacity:.55}50%{opacity:1}}
.pn{transform-box:fill-box;transform-origin:center;animation:pn 2.8s ease-in-out infinite}@keyframes pn{0%,100%{opacity:.45;transform:scale(.82)}50%{opacity:1;transform:scale(1.15)}}
.lk{animation:lk 2.8s linear infinite}@keyframes lk{from{stroke-dashoffset:117}to{stroke-dashoffset:0}}
.sb{animation:sb 2.8s ease-in-out infinite}@keyframes sb{0%,100%{opacity:.28}45%{opacity:1}}
.sl{animation:sl 2.8s ease-in-out infinite}@keyframes sl{0%{transform:translateX(0)}50%{transform:translateX(176px)}100%{transform:translateX(0)}}
.bar{animation:bar 2.8s ease-in-out infinite}@keyframes bar{0%{stroke-dashoffset:22}30%{stroke-dashoffset:0}85%{stroke-dashoffset:0}100%{stroke-dashoffset:22}}
.dt{animation:dt 2.8s ease-in-out infinite}@keyframes dt{0%,100%{opacity:.18}45%{opacity:.95}}
.draw{animation:draw 3.6s ease-in-out infinite}@keyframes draw{0%{stroke-dashoffset:260}45%{stroke-dashoffset:0}88%{stroke-dashoffset:0}100%{stroke-dashoffset:-260}}
.wv{transform-box:fill-box;transform-origin:center;animation:wv 2.25s ease-out infinite}@keyframes wv{0%{opacity:.8;transform:scale(.45)}100%{opacity:0;transform:scale(2.6)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs>
