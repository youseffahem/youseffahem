<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 380 214" width="380" height="214" role="img" aria-label="Hand Gesture Volume Control. MediaPipe tracks 21 hand landmarks; the distance between the thumb tip and index tip is mapped to a volume level between 0 and 100 percent, driven through PyCAW into the Windows Core Audio API." preserveAspectRatio="xMidYMid meet">
<title>HAND GESTURE VOLUME</title>

