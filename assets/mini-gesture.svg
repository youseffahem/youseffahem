text{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace}.sans{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.sw{animation:sw 7s linear infinite}@keyframes sw{from{transform:translateX(-190px)}to{transform:translateX(380px)}}
.led{animation:led 2.4s ease-in-out infinite}@keyframes led{0%,100%{opacity:.35}50%{opacity:1}}
.pn{transform-box:fill-box;transform-origin:center;animation:pn 2.8s ease-in-out infinite}@keyframes pn{0%,100%{opacity:.45;transform:scale(.82)}50%{opacity:1;transform:scale(1.16)}}
.rg{transform-box:fill-box;transform-origin:center;animation:rg 2.8s ease-out infinite}@keyframes rg{0%{opacity:.75;transform:scale(.5)}100%{opacity:0;transform:scale(2.5)}}
.hl{opacity:0;animation:hl 6s ease-in-out infinite}@keyframes hl{0%,100%{opacity:0}5%{opacity:1}18%{opacity:0}}
.chev{animation:chev 6s ease-in-out infinite}@keyframes chev{0%,100%{opacity:.28}9%{opacity:1}24%{opacity:.28}}
.dash{animation:dash 2.4s linear infinite}@keyframes dash{to{stroke-dashoffset:-24}}
.lm{transform-box:fill-box;transform-origin:center;animation:lm 2.8s ease-in-out infinite}@keyframes lm{0%,100%{opacity:.5;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}.span{animation:span 3.2s ease-in-out infinite}@keyframes span{0%,100%{opacity:.4;stroke-width:1}50%{opacity:1;stroke-width:1.8}}.vol{animation:vol 3.2s ease-in-out infinite}@keyframes vol{0%,100%{transform:scaleY(.28)}50%{transform:scaleY(1)}}.tip{transform-box:fill-box;transform-origin:center;animation:tip 3.2s ease-in-out infinite}@keyframes tip{0%,100%{transform:translate(0,0)}50%{transform:translate(9px,10px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
