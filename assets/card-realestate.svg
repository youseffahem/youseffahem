<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="RealEstate - Flask and MySQL property management platform" preserveAspectRatio="xMidYMid meet">
<title>RealEstate</title>
<defs>
  <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#12021F"/>
    <stop offset="0.42" stop-color="#22062F"/>
    <stop offset="1" stop-color="#08010F"/>
  </linearGradient>
  <linearGradient id="wash" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FF2D75" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#FF2D75" stop-opacity="0.16"/>
    <stop offset="1" stop-color="#FF2D75" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#FF9CC8"/>
  </linearGradient>
  <linearGradient id="lacc" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FF4D9E"/>
    <stop offset="1" stop-color="#8B0020"/>
  </linearGradient>
  <filter id="cg" x="-60%" y="-200%" width="220%" height="500%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="cgs" x="-300%" y="-300%" width="700%" height="700%">
    <feGaussianBlur stdDeviation="2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .t{font-family:'JetBrains Mono','Fira Code',ui-monospace,Consolas,monospace}
    .tbl{fill:#1E0733;stroke:#DC143C;stroke-width:1;stroke-opacity:.75}
    .row{fill:#FF2D75;opacity:.35}
    .blink{animation:bk 3s ease-in-out infinite}
    @keyframes bk{0%,100%{opacity:.3}50%{opacity:.95}}
  </style>
</defs>

<rect x="1" y="1" width="1198" height="118" rx="14" fill="url(#cbg)"/>
<rect x="-420" y="1" width="420" height="118" fill="url(#wash)">
  <animate attributeName="x" values="-420;1200" dur="10s" repeatCount="indefinite"/>
</rect>
<rect x="1" y="1" width="1198" height="118" rx="14" fill="none" stroke="#DC143C" stroke-opacity="0.32" stroke-width="1.4"/>
<rect x="1" y="1" width="1198" height="118" rx="14" fill="none" stroke="#FF6BB0" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="170 2438" filter="url(#cgs)">
  <animate attributeName="stroke-dashoffset" values="2608;0" dur="7s" repeatCount="indefinite"/>
</rect>

<rect x="28" y="30" width="4.5" height="60" rx="2.25" fill="url(#lacc)" filter="url(#cgs)"/>

<text class="t" x="50" y="44" font-size="12" letter-spacing="3.4" fill="#FF6BB0" opacity="0.95">FLASK &#183; MYSQL &#183; JINJA2</text>
<text class="t" x="50" y="78" font-size="34" font-weight="700" letter-spacing="3.4" fill="url(#ttl)" filter="url(#cg)">REALESTATE</text>
<text class="t" x="50" y="100" font-size="12.5" letter-spacing="1.6" fill="#9B7A96">Property management platform &#183; 274 passing tests</text>

<g transform="translate(846 22)">
  <g class="tbl"><rect x="0" y="16" width="76" height="46" rx="4"/></g>
  <rect class="row" x="8" y="26" width="60" height="3.4" rx="1.7"/>
  <rect class="row" x="8" y="35" width="46" height="3.4" rx="1.7"/>
  <rect class="row" x="8" y="44" width="54" height="3.4" rx="1.7"/>
  <text class="t" x="38" y="72" font-size="8.5" letter-spacing="1" fill="#9B7A96" text-anchor="middle">agents</text>

  <g class="tbl"><rect x="118" y="6" width="82" height="66" rx="4"/></g>
  <rect class="row" x="127" y="16" width="64" height="3.4" rx="1.7"/>
  <rect class="row" x="127" y="25" width="52" height="3.4" rx="1.7"/>
  <rect class="row" x="127" y="34" width="60" height="3.4" rx="1.7"/>
  <rect class="row" x="127" y="43" width="44" height="3.4" rx="1.7"/>
  <rect class="row" x="127" y="52" width="56" height="3.4" rx="1.7"/>
  <text class="t" x="159" y="82" font-size="8.5" letter-spacing="1" fill="#FFB3D2" text-anchor="middle">properties</text>

  <g class="tbl"><rect x="242" y="16" width="76" height="46" rx="4"/></g>
  <rect class="row" x="250" y="26" width="60" height="3.4" rx="1.7"/>
  <rect class="row" x="250" y="35" width="48" height="3.4" rx="1.7"/>
  <rect class="row" x="250" y="44" width="56" height="3.4" rx="1.7"/>
  <text class="t" x="280" y="72" font-size="8.5" letter-spacing="1" fill="#9B7A96" text-anchor="middle">inquiries</text>

  <path id="fk1" d="M76,39 L118,39" stroke="#FF2D75" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path id="fk2" d="M200,39 L242,39" stroke="#FF2D75" stroke-width="1.2" fill="none" opacity="0.6"/>

  <circle r="2.6" fill="#FFC2DE" filter="url(#cgs)">
    <animateMotion dur="2.6s" repeatCount="indefinite"><mpath href="#fk1" xlink:href="#fk1"/></animateMotion>
  </circle>
  <circle r="2.6" fill="#FFC2DE" filter="url(#cgs)">
    <animateMotion dur="2.6s" begin="1.3s" repeatCount="indefinite"><mpath href="#fk2" xlink:href="#fk2"/></animateMotion>
  </circle>

  <circle class="blink" cx="76" cy="39" r="2" fill="#FF6BB0"/>
  <circle class="blink" cx="118" cy="39" r="2" fill="#FF6BB0" style="animation-delay:.5s"/>
  <circle class="blink" cx="200" cy="39" r="2" fill="#FF6BB0" style="animation-delay:1s"/>
  <circle class="blink" cx="242" cy="39" r="2" fill="#FF6BB0" style="animation-delay:1.5s"/>
</g>
</svg>
