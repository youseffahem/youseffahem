<circle class="tgt" cx="460" cy="20" r="3.4" fill="none" stroke="#818CF8" stroke-width="0.9"/>
<circle class="tdot" cx="460" cy="20" r="2.4" fill="#818CF8"/>
<path d="M22,56 H558" stroke="#1E293B" stroke-width="1"/>
<g class="scan"><rect x="22" y="63" width="536" height="15" fill="url(#sl)"/><rect x="22" y="83" width="536" height="1" fill="#818CF8" opacity="0.34"/></g>
<rect class="bt" x="26" y="72" width="5" height="5" rx="1.2" fill="#818CF8" style="animation-delay:0.00s"/>
<text x="39" y="77" font-size="11" letter-spacing="0.3" fill="#94A3B8">PyTorch</text>
<path d="M39,82 H178" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="1 4" opacity="0.6"/>
<rect class="bt" x="294" y="72" width="5" height="5" rx="1.2" fill="#818CF8" style="animation-delay:0.16s"/>
<text x="307" y="77" font-size="11" letter-spacing="0.3" fill="#94A3B8">LightGBM</text>
<path d="M307,82 H446" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="1 4" opacity="0.6"/>
<rect class="bt" x="26" y="93" width="5" height="5" rx="1.2" fill="#818CF8" style="animation-delay:0.32s"/>
<text x="39" y="98" font-size="11" letter-spacing="0.3" fill="#94A3B8">GRU / TCN</text>
<path d="M39,103 H178" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="1 4" opacity="0.6"/>
<rect class="bt" x="294" y="93" width="5" height="5" rx="1.2" fill="#818CF8" style="animation-delay:0.48s"/>
<text x="307" y="98" font-size="11" letter-spacing="0.3" fill="#94A3B8">PyArrow</text>
<path d="M307,103 H446" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="1 4" opacity="0.6"/>
<rect class="bt" x="26" y="114" width="5" height="5" rx="1.2" fill="#818CF8" style="animation-delay:0.64s"/>
<text x="39" y="119" font-size="11" letter-spacing="0.3" fill="#94A3B8">Ablation studies</text>
<path d="M39,124 H178" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="1 4" opacity="0.6"/>
<rect class="bt" x="294" y="114" width="5" height="5" rx="1.2" fill="#818CF8" style="animation-delay:0.80s"/>
<text x="307" y="119" font-size="11" letter-spacing="0.3" fill="#94A3B8">Pre-registration</text>
<path d="M307,124 H446" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="1 4" opacity="0.6"/>
<path d="M26,149 H554" stroke="#334155" stroke-width="1" stroke-dasharray="2 4"/>
<text x="554" y="145" text-anchor="end" font-size="7" letter-spacing="1" fill="#475569">ZONE EDGE</text>
<path d="M30,134 C90,128 150,129 210,134 S320,142 372,140" fill="none" stroke="#818CF8" stroke-width="1.4" stroke-linecap="round" opacity="0.75"/>
<path class="pdash" d="M372,140 C400,139 424,142 446,149" fill="none" stroke="#818CF8" stroke-width="1.4" stroke-dasharray="4 2" stroke-linecap="round"/>
<circle cx="446" cy="149" r="3" fill="#818CF8"/>
<text x="456" y="136" font-size="7" letter-spacing="1" fill="#64748B">PREDICTED IMPACT</text>
<circle class="imp" cx="446" cy="149" r="6" fill="none" stroke="#818CF8" stroke-width="1.1"/>
<circle r="3" fill="#F8FAFC" filter="url(#cg)"><animateMotion dur="2.4s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.6;1" calcMode="linear" path="M30,134 C90,128 150,129 210,134 S320,142 372,140 C400,139 424,142 446,149"/></circle>
<path d="M22,157 H558" stroke="#1E293B" stroke-width="1"/>
<text x="26" y="184" font-size="7.5" letter-spacing="1.4" fill="#475569">FLOW</text>
<path d="M72,181 H546" stroke="#243044" stroke-width="1" stroke-dasharray="3 4"/>
<circle class="fn" cx="72.0" cy="181" r="3.2" fill="#818CF8" style="animation-delay:0.00s"/>
<text x="69.0" y="195" text-anchor="start" font-size="7.5" letter-spacing="0.9" fill="#64748B">TRAJECTORY</text>
<circle class="fn" cx="230.0" cy="181" r="3.2" fill="#818CF8" style="animation-delay:0.42s"/>
<text x="230.0" y="195" text-anchor="middle" font-size="7.5" letter-spacing="0.9" fill="#64748B">WINDOW</text>
<circle class="fn" cx="388.0" cy="181" r="3.2" fill="#818CF8" style="animation-delay:0.84s"/>
<text x="388.0" y="195" text-anchor="middle" font-size="7.5" letter-spacing="0.9" fill="#64748B">MODEL</text>
<circle class="fn" cx="546.0" cy="181" r="3.2" fill="#818CF8" style="animation-delay:1.26s"/>
<text x="549.0" y="195" text-anchor="end" font-size="7.5" letter-spacing="0.9" fill="#64748B">ANTICIPATE</text>
<circle class="fl" cx="72" cy="181" r="2.4" fill="#F8FAFC" filter="url(#cg)"/>
<g><rect x="26" y="209" width="156.8" height="20" rx="5" fill="#0B1120" stroke="#243044" stroke-width="1"/><circle class="led" cx="37" cy="219" r="2.8" fill="#818CF8" style="animation-delay:0.00s"/><text x="47" y="222.5" font-size="8.5" letter-spacing="0.7" fill="#94A3B8">PLANS: PRE-REGISTERED</text></g>
<g><rect x="191.8" y="209" width="162.6" height="20" rx="5" fill="#0B1120" stroke="#243044" stroke-width="1"/><circle class="led" cx="202.8" cy="219" r="2.8" fill="#818CF8" style="animation-delay:0.40s"/><text x="212.8" y="222.5" font-size="8.5" letter-spacing="0.7" fill="#94A3B8">SPLITS: BY PARTICIPANT</text></g>
<text x="554" y="222.5" text-anchor="end" font-size="8.5" letter-spacing="1.1" fill="#475569">6 MODULES</text>
<path d="M14,235 H566" stroke="#1E293B" stroke-width="1" stroke-dasharray="2 5"/>
<rect class="bus" x="-18" y="233.6" width="18" height="2.8" rx="1.4" fill="url(#pkg)" filter="url(#cg)" style="animation-delay:0s"/>
<rect class="bus" x="-18" y="233.6" width="18" height="2.8" rx="1.4" fill="url(#pkg)" filter="url(#cg)" style="animation-delay:-2.3s"/>
</svg>
