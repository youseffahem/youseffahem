<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 580 241" width="580" height="241" role="img" aria-label="Temporal machine learning subsystem. Technologies: PyTorch, LightGBM, GRU and TCN sequence models, PyArrow, ablation studies and pre-registered evaluation. Flow: trajectory to window to model to anticipated strike." preserveAspectRatio="xMidYMid meet">
<title>TEMPORAL ML subsystem</title>

<defs>
<linearGradient id="pg" x1="0" y1="0" x2="0.5" y2="1"><stop offset="0" stop-color="#0F172A"/><stop offset="1" stop-color="#07111F"/></linearGradient>
<linearGradient id="tl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#818CF8" stop-opacity="0"/><stop offset="0.5" stop-color="#818CF8" stop-opacity="0.9"/><stop offset="1" stop-color="#818CF8" stop-opacity="0"/></linearGradient>
<linearGradient id="sl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#818CF8" stop-opacity="0"/><stop offset="0.7" stop-color="#818CF8" stop-opacity="0.07"/><stop offset="1" stop-color="#818CF8" stop-opacity="0.35"/></linearGradient>
<radialGradient id="bl" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#818CF8" stop-opacity="0.13"/><stop offset="1" stop-color="#818CF8" stop-opacity="0"/></radialGradient>
<linearGradient id="pkg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#818CF8" stop-opacity="0"/><stop offset="1" stop-color="#818CF8"/></linearGradient>
<pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#101D30" stroke-width="1"/></pattern>
<filter id="cg" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="csoft"><feGaussianBlur stdDeviation="22"/></filter>
<style>
text{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace}.sans{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.sw{animation:sw 6s linear infinite}@keyframes sw{from{transform:translateX(-290px)}to{transform:translateX(580px)}}
.scan{animation:scan 5.2s ease-in-out infinite}@keyframes scan{0%{transform:translateY(0)}50%{transform:translateY(63px)}100%{transform:translateY(0)}}
.bt{transform-box:fill-box;transform-origin:center;animation:bt 3.4s ease-in-out infinite}@keyframes bt{0%,100%{opacity:.4;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.led{animation:led 2.4s ease-in-out infinite}@keyframes led{0%,100%{opacity:.35}50%{opacity:1}}
.fn{transform-box:fill-box;transform-origin:center;animation:fn 4s ease-in-out infinite}@keyframes fn{0%,100%{opacity:.4;transform:scale(.85)}16%{opacity:1;transform:scale(1.3)}42%{opacity:.4;transform:scale(.85)}}
.fl{animation:fl 4s linear infinite}@keyframes fl{from{transform:translateX(0)}to{transform:translateX(482px)}}
.bus{animation:bus 4.6s linear infinite}@keyframes bus{from{transform:translateX(-18px)}to{transform:translateX(580px)}}
.tgt{transform-box:fill-box;transform-origin:center;animation:tgt 2.2s ease-out infinite}@keyframes tgt{0%{opacity:.8;transform:scale(.5)}100%{opacity:0;transform:scale(2.4)}}
.tdot{animation:led 2.4s ease-in-out infinite}
.pdash{animation:pdash .9s linear infinite}@keyframes pdash{to{stroke-dashoffset:-12}}
.imp{transform-box:fill-box;transform-origin:center;animation:imp 2.4s ease-out infinite}@keyframes imp{0%,55%{opacity:0;transform:scale(.4)}62%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs>
<rect x="1" y="1" width="578" height="239" rx="12" fill="url(#pg)"/>
<rect x="1" y="1" width="578" height="239" rx="12" fill="url(#grid)" opacity="0.5"/>
<ellipse cx="70" cy="26" rx="200" ry="80" fill="url(#bl)" filter="url(#csoft)"/>
<rect x="1" y="1" width="578" height="239" rx="12" fill="none" stroke="#243044" stroke-width="1.2"/>
<g><rect class="sw" x="0" y="1" width="290" height="1.5" fill="url(#tl)"/></g>
<rect x="22" y="18" width="3.4" height="22" rx="1.7" fill="#818CF8"/>
<text class="sans" x="36" y="35" font-size="15" font-weight="700" letter-spacing="2" fill="#F8FAFC">TEMPORAL ML</text>
<text x="554" y="27" text-anchor="end" font-size="8" letter-spacing="1.6" fill="#475569">SUBSYS 08</text>
<circle class="led" cx="510" cy="38" r="2.8" fill="#818CF8"/>
<text x="518" y="41" font-size="8" letter-spacing="1.1" fill="#64748B">ONLINE</text>
