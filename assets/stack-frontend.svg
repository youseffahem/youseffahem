<path d="M307,82 H446" stroke="#1E293B" stroke-width="0.8" stroke-dasharray="1 4" opacity="0.6"/>
<rect class="bt" x="26" y="93" width="5" height="5" rx="1.2" fill="#22D3EE" style="animation-delay:0.32s"/>
<text x="39" y="98" font-size="11" letter-spacing="0.3" fill="#94A3B8">Vanilla JavaScript</text>
