<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 760 56" width="760" height="56" role="img" aria-label="Flagship project: Space Drums, a drum kit you play in thin air." preserveAspectRatio="xMidYMid meet">
<title>Flagship project: Space Drums</title>

<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#131C31"/><stop offset="1" stop-color="#0B1120"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F43F5E"/><stop offset="0.5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#06B6D4"/></linearGradient>
<linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F8FAFC"/><stop offset="0.55" stop-color="#FDA4AF"/><stop offset="1" stop-color="#C4B5FD"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.13"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<clipPath id="clip"><rect x="1" y="1" width="758" height="54" rx="27"/></clipPath>
<filter id="g" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
text{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace}.sans{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.shn{animation:shn 4.4s ease-in-out infinite}@keyframes shn{0%{transform:translateX(-240px)}55%,100%{transform:translateX(1000px)}}
.dot{transform-box:fill-box;transform-origin:center;animation:dot 1.6s ease-in-out infinite}@keyframes dot{0%,100%{opacity:.6;transform:scale(.85)}50%{opacity:1;transform:scale(1.15)}}
.rip{transform-box:fill-box;transform-origin:center;animation:rip 1.6s ease-out infinite}@keyframes rip{0%{opacity:.85;transform:scale(.6)}100%{opacity:0;transform:scale(2.7)}}
.eq{transform-box:fill-box;transform-origin:50% 100%;animation:eq .9s ease-in-out infinite alternate}@keyframes eq{from{transform:scaleY(.22)}to{transform:scaleY(1)}}
.arr{animation:arr 1.6s ease-in-out infinite}@keyframes arr{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
.edge{animation:edge 3s ease-in-out infinite}@keyframes edge{0%,100%{stroke-opacity:.5}50%{stroke-opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs>
<rect x="1" y="1" width="758" height="54" rx="27" fill="url(#bg)"/>
<g clip-path="url(#clip)"><g transform="skewX(-20)"><rect class="shn" x="0" y="0" width="200" height="56" fill="url(#shine)"/></g></g>
<rect class="edge" x="1" y="1" width="758" height="54" rx="27" fill="none" stroke="url(#edge)" stroke-width="1.4"/>
<rect x="9" y="9" width="148" height="38" rx="19" fill="#F43F5E" fill-opacity="0.12" stroke="#F43F5E" stroke-opacity="0.55" stroke-width="1"/>
<circle class="rip" cx="31" cy="28" r="5" fill="none" stroke="#FB7185" stroke-width="1.2"/>
<circle class="dot" cx="31" cy="28" r="4.6" fill="#FB7185" filter="url(#g)"/>
<text x="46" y="32.5" font-size="12.5" font-weight="700" letter-spacing="2.6" fill="#FDA4AF">FLAGSHIP</text>
<rect class="eq" x="174" y="27" width="4" height="11" rx="1.5" fill="#A78BFA" style="animation-duration:0.8s;animation-delay:-0.1s"/>
<rect class="eq" x="181" y="18" width="4" height="20" rx="1.5" fill="#A78BFA" style="animation-duration:0.95s;animation-delay:-0.55s"/>
<rect class="eq" x="188" y="24" width="4" height="14" rx="1.5" fill="#A78BFA" style="animation-duration:0.7s;animation-delay:-0.3s"/>
<rect class="eq" x="195" y="20" width="4" height="18" rx="1.5" fill="#A78BFA" style="animation-duration:1.05s;animation-delay:-0.75s"/>
<rect class="eq" x="202" y="29" width="4" height="9" rx="1.5" fill="#A78BFA" style="animation-duration:0.85s;animation-delay:-0.2s"/>
<text class="sans" x="222" y="35" font-size="19" font-weight="800" letter-spacing="2.6" fill="url(#ttl)">SPACE DRUMS</text>
<path d="M410,18 V38" stroke="#334155" stroke-width="1"/>
<text x="424" y="32.5" font-size="12.5" fill="#94A3B8" textLength="232.5" lengthAdjust="spacing">a drum kit you play in thin air</text>
<circle cx="722" cy="28" r="17" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-opacity="0.6"/>
<g class="arr"><path d="M713.5,28 H729 M723,22 L729,28 L723,34" fill="none" stroke="#E2E8F0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
