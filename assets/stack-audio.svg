<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 580 241" width="580" height="241" role="img" aria-label="Real-time audio subsystem. Technologies: sounddevice, soundfile, NumPy, SciPy, a callback mixer and round-robin samples with soft and hard layers. Flow: strike to schedule to mix to output." preserveAspectRatio="xMidYMid meet">
<title>REAL-TIME AUDIO subsystem</title>

<defs>
<linearGradient id="pg" x1="0" y1="0" x2="0.5" y2="1"><stop offset="0" stop-color="#0F172A"/><stop offset="1" stop-color="#07111F"/></linearGradient>
<linearGradient id="tl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FB7185" stop-opacity="0"/><stop offset="0.5" stop-color="#FB7185" stop-opacity="0.9"/><stop offset="1" stop-color="#FB7185" stop-opacity="0"/></linearGradient>
<linearGradient id="sl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FB7185" stop-opacity="0"/><stop offset="0.7" stop-color="#FB7185" stop-opacity="0.07"/><stop offset="1" stop-color="#FB7185" stop-opacity="0.35"/></linearGradient>
<radialGradient id="bl" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FB7185" stop-opacity="0.13"/><stop offset="1" stop-color="#FB7185" stop-opacity="0"/></radialGradient>
<linearGradient id="pkg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FB7185" stop-opacity="0"/><stop offset="1" stop-color="#FB7185"/></linearGradient>
<pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#101D30" stroke-width="1"/></pattern>
<filter id="cg" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="csoft"><feGaussianBlur stdDeviation="22"/></filter>
<style>
text{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace}.sans{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.sw{animation:sw 6s linear infinite}@keyframes sw{from{transform:translateX(-290px)}to{transform:translateX(580px)}}
.scan{animation:scan 5.2s ease-in-out infinite}@keyframes scan{0%{transform:translateY(0)}50%{transform:translateY(63px)}100%{transform:translateY(0)}}
.bt{transform-box:fill-box;transform-origin:center;animation:bt 3.4s ease-in-out infinite}@keyframes bt{0%,100%{opacity:.4;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.led{animation:led 2.4s ease-in-out infinite}@keyframes led{0%,100%{opacity:.35}50%{opacity:1}}
.fn{transform-box:fill-box;transform-origin:center;animation:fn 4s ease-in-out infinite}@keyframes fn{0%,100%{opacity:.4;transform:scale(.85)}16%{opacity:1;transform:scale(1.3)}42%{opacity:.4;transform:scale(.85)}}
.fl{animation:fl 4s linear infinite}@keyframes fl{from{transform:translateX(0)}to{transform:translateX(482px)}}
.bus{animation:bus 4.6s linear infinite}@keyframes bus{from{transform:translateX(-18px)}to{transform:translateX(580px)}}
.arc{animation:arc 1.8s ease-in-out infinite}@keyframes arc{0%,100%{opacity:.2}35%{opacity:1}}
.eqs{transform-box:fill-box;transform-origin:50% 100%;animation:eqs 1s ease-in-out infinite alternate}@keyframes eqs{from{transform:scaleY(.15)}to{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs>
