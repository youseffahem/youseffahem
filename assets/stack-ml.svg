<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 580 241" width="580" height="241" role="img" aria-label="MACHINE LEARNING subsystem. Technologies: scikit-learn, XGBoost, Pandas, NumPy, Streamlit, Plotly, Matplotlib, Seaborn, SMOTE, PCA. Flow: data to features to model to prediction. Status: data ready, model ready." preserveAspectRatio="xMidYMid meet">
<title>MACHINE LEARNING subsystem</title>

<defs>
