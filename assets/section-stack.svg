<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 88" width="1200" height="88" role="img" aria-label="Section heading: Technology stack, organised as engineering subsystems." preserveAspectRatio="xMidYMid meet">
<title>Section: Technology Stack</title>

<defs>
<linearGradient id="pg" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#0F172A"/><stop offset="1" stop-color="#0B1120"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#06B6D4" stop-opacity="0.75"/><stop offset="0.45" stop-color="#243044" stop-opacity="0.9"/><stop offset="1" stop-color="#1E293B" stop-opacity="0.6"/></linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#06B6D4"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0.25"/></linearGradient>
<linearGradient id="tl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#06B6D4" stop-opacity="0"/><stop offset="0.5" stop-color="#06B6D4" stop-opacity="0.9"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/></linearGradient>
<radialGradient id="bloom" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#06B6D4" stop-opacity="0.16"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#101D30" stroke-width="1"/></pattern>
<filter id="sg" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="sf"><feGaussianBlur stdDeviation="20"/></filter>
<style>
text{font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace}.sans{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.sw{animation:sw 6.5s linear infinite}@keyframes sw{from{transform:translateX(-460px)}to{transform:translateX(1200px)}}
.ab{animation:ab 3s ease-in-out infinite}@keyframes ab{0%,100%{opacity:.55}50%{opacity:1}}
.pn{transform-box:fill-box;transform-origin:center;animation:pn 2.8s ease-in-out infinite}@keyframes pn{0%,100%{opacity:.45;transform:scale(.82)}50%{opacity:1;transform:scale(1.15)}}
.lk{animation:lk 2.8s linear infinite}@keyframes lk{from{stroke-dashoffset:117}to{stroke-dashoffset:0}}
.sb{animation:sb 2.8s ease-in-out infinite}@keyframes sb{0%,100%{opacity:.28}45%{opacity:1}}
.sl{animation:sl 2.8s ease-in-out infinite}@keyframes sl{0%{transform:translateX(0)}50%{transform:translateX(176px)}100%{transform:translateX(0)}}
.bar{animation:bar 2.8s ease-in-out infinite}@keyframes bar{0%{stroke-dashoffset:22}30%{stroke-dashoffset:0}85%{stroke-dashoffset:0}100%{stroke-dashoffset:22}}
.dt{animation:dt 2.8s ease-in-out infinite}@keyframes dt{0%,100%{opacity:.18}45%{opacity:.95}}
.draw{animation:draw 3.6s ease-in-out infinite}@keyframes draw{0%{stroke-dashoffset:260}45%{stroke-dashoffset:0}88%{stroke-dashoffset:0}100%{stroke-dashoffset:-260}}
.wv{transform-box:fill-box;transform-origin:center;animation:wv 2.25s ease-out infinite}@keyframes wv{0%{opacity:.8;transform:scale(.45)}100%{opacity:0;transform:scale(2.6)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></defs>
<rect x="1" y="1" width="1198" height="86" rx="12" fill="url(#pg)"/>
<rect x="1" y="1" width="1198" height="86" rx="12" fill="url(#grid)" opacity="0.5"/>
<ellipse cx="120" cy="44" rx="230" ry="60" fill="url(#bloom)" filter="url(#sf)"/>
<rect x="1" y="1" width="1198" height="86" rx="12" fill="none" stroke="url(#edge)" stroke-width="1.3"/>
<g><rect class="sw" x="0" y="1" width="460" height="1.5" fill="url(#tl)"/></g>
<rect class="ab" x="26" y="22" width="4" height="44" rx="2" fill="url(#acc)" filter="url(#sg)"/>
<text x="46" y="36" font-size="10" letter-spacing="2.6" fill="#06B6D4" opacity="0.92">02 / SUBSYSTEMS</text>
<text class="sans" x="46" y="68" font-size="27" font-weight="800" letter-spacing="4.6" fill="#F8FAFC">TECHNOLOGY STACK</text>
<text x="452" y="66" font-size="9.5" letter-spacing="1.5" fill="#64748B">languages &#183; frameworks &#183; tooling</text>
